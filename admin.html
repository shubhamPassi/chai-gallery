<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <meta name="robots" content="noindex, nofollow">
  <title>Chai Gallery | Order Desk</title>
  <link rel="icon" href="assets/images/chai-gallery-logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <a class="admin-brand" href="index.html"><img src="assets/images/chai-gallery-logo.png" alt=""><span><strong>CHAI GALLERY</strong><small>ORDER DESK</small></span></a>
    <section class="admin-login" data-admin-login>
      <p class="eyebrow"><span></span> Private access</p>
      <h1>ORDER<br><em>DESK</em></h1>
      <p>Sign in to prepare, dispatch and complete paid orders.</p>
      <form data-admin-login-form>
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <p class="admin-message" data-admin-login-message role="status"></p>
        <button class="button button-primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
    </section>
    <section class="admin-dashboard" data-admin-dashboard hidden>
      <header class="admin-header"><div><p class="eyebrow"><span></span> Chai Gallery</p><h1>LIVE <em>ORDERS</em></h1></div><div class="admin-actions"><button type="button" class="button button-ghost" data-admin-refresh>Refresh</button><button type="button" class="button button-ghost" data-admin-signout>Sign out</button></div></header>
      <p class="admin-message" data-admin-dashboard-message role="status"></p>
      <div class="order-filters" data-order-filters><button class="is-active" type="button" data-order-filter="active">Active</button><button type="button" data-order-filter="all">All orders</button><button type="button" data-order-filter="completed">Completed</button></div>
      <div class="admin-orders" data-admin-orders></div>
    </section>
  </main>
  <script src="js/admin-config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
